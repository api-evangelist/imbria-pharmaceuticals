aid: imbria-pharmaceuticals
name: Imbria Pharmaceuticals
description: >-
  Imbria Pharmaceuticals is a private, clinical-stage biopharmaceutical company based in the Boston
  area that is developing novel cardiovascular therapies targeting cardiac energy metabolism. Its
  lead candidate, ninerafaxstat, is a first-in-class partial fatty acid oxidation (pFOX) inhibitor
  designed to shift myocardial substrate utilization toward glucose oxidation, generating more ATP
  per unit of oxygen consumed and improving cardiac metabolic efficiency without affecting heart
  rate, rhythm, ejection fraction or blood pressure. Ninerafaxstat is in the global FORTITUDE-HCM
  Phase 2b trial (NCT07023614) for symptomatic non-obstructive hypertrophic cardiomyopathy (nHCM),
  which has no approved treatments, and holds FDA Orphan Drug Designation for that indication; a
  Phase 2b in cardiometabolic HFpEF is planned. The company is backed by RA Capital, SV Health
  Investors, Deep Track Capital, Catalio Capital Management, AN Ventures and Cytokinetics. Imbria
  is a therapeutics developer, not a software vendor, and publishes no public API, developer
  portal, SDK or machine-readable API contract.
